# Render Blueprint for Soteria Dialogue
# This file defines the infrastructure for Render to provision.
# Docs: https://render.com/docs/blueprint-spec

databases:
  # --- PostgreSQL Database ---
  - name: soteria-db
    region: oregon
    plan: free  # upgrade to starter for production (note: free Postgres expires after 30 days)
    ipAllowList: []

services:
  # --- Web Service (Next.js app) ---
  - type: web
    name: soteria-dialogue
    region: oregon
    plan: free  # upgrade to starter for production
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: soteria-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://soteria-dialogue.onrender.com
      - key: NODE_ENV
        value: production